<svg xmlns="http://www.w3.org/2000/svg" width="760" height="437" viewBox="0 0 760 437" role="img" aria-labelledby="title desc">
  <title id="title">MTP decode throughput across all five benchmark configurations</title>
  <desc id="desc">Common linear scale, tokens per second. PC CPU stock 13.73 to 17.45, POC 14.59 to 18.90. PC RTX 4090 stock 111.45 to 154.48, POC 110.91 to 151.62. Pixel GPU POC 7.7 to 12.8. PC medians, Pixel means; separate within-configuration comparisons.</desc>
  <rect x="0.5" y="0.5" width="759" height="436" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#172b3e">
    <text x="22" y="31" font-size="17" font-weight="700">Decode throughput with MTP</text>
    <text x="22" y="51" font-size="11" fill="#475569">Forge-GM narrator benchmark · tokens/s · common linear scale</text>
    <rect x="515" y="21" width="12" height="12" rx="2" fill="#8494a8"/>
    <text x="534" y="31" font-size="11">MTP off</text>
    <rect x="623" y="21" width="12" height="12" rx="2" fill="#176b80"/>
    <text x="642" y="31" font-size="11">MTP on</text>
    <line x1="190" y1="96" x2="190" y2="383" stroke="#d5dee8"/><text x="190" y="398" font-size="11" text-anchor="middle" fill="#475569">0</text>
    <line x1="290" y1="96" x2="290" y2="383" stroke="#d5dee8"/><text x="290" y="398" font-size="11" text-anchor="middle" fill="#475569">40</text>
    <line x1="390" y1="96" x2="390" y2="383" stroke="#d5dee8"/><text x="390" y="398" font-size="11" text-anchor="middle" fill="#475569">80</text>
    <line x1="490" y1="96" x2="490" y2="383" stroke="#d5dee8"/><text x="490" y="398" font-size="11" text-anchor="middle" fill="#475569">120</text>
    <line x1="590" y1="96" x2="590" y2="383" stroke="#d5dee8"/><text x="590" y="398" font-size="11" text-anchor="middle" fill="#475569">160</text>
    <text x="22" y="86" font-size="14" font-weight="700">PC CPU</text><text x="735" y="86" font-size="11" text-anchor="end" fill="#475569">Median · 3 runs/mode</text>
    <text x="22" y="118" font-size="12">Official stock</text>
    <rect x="190" y="98" width="34.33" height="15" rx="2" fill="#8494a8"/>
    <rect x="190" y="116" width="43.63" height="15" rx="2" fill="#176b80"/>
    <text x="231.32" y="110" font-size="11">13.73</text>
    <text x="240.63" y="128" font-size="11" font-weight="700">17.45</text>
    <text x="735" y="110" text-anchor="end" font-size="17" font-weight="700" fill="#176b80">1.27×</text>
    <text x="735" y="127" text-anchor="end" font-size="11" fill="#475569">+27.1%</text>
    <text x="22" y="162" font-size="12">LoRA POC</text>
    <rect x="190" y="142" width="36.48" height="15" rx="2" fill="#8494a8"/>
    <rect x="190" y="160" width="47.25" height="15" rx="2" fill="#176b80"/>
    <text x="233.47" y="154" font-size="11">14.59</text>
    <text x="244.25" y="172" font-size="11" font-weight="700">18.90</text>
    <text x="735" y="154" text-anchor="end" font-size="17" font-weight="700" fill="#176b80">1.30×</text>
    <text x="735" y="171" text-anchor="end" font-size="11" fill="#475569">+29.6%</text>
    <line x1="22" y1="184" x2="738" y2="184" stroke="#cbd5e1"/>
    <text x="22" y="205" font-size="14" font-weight="700">PC RTX 4090</text><text x="735" y="205" font-size="11" text-anchor="end" fill="#475569">Median · 3 runs/mode</text>
    <text x="22" y="237" font-size="12">Official stock</text>
    <rect x="190" y="217" width="278.63" height="15" rx="2" fill="#8494a8"/>
    <rect x="190" y="235" width="386.20" height="15" rx="2" fill="#176b80"/>
    <text x="475.63" y="229" font-size="11">111.45</text>
    <text x="583.20" y="247" font-size="11" font-weight="700">154.48</text>
    <text x="735" y="229" text-anchor="end" font-size="17" font-weight="700" fill="#176b80">1.39×</text>
    <text x="735" y="246" text-anchor="end" font-size="11" fill="#475569">+38.6%</text>
    <text x="22" y="281" font-size="12">LoRA POC</text>
    <rect x="190" y="261" width="277.27" height="15" rx="2" fill="#8494a8"/>
    <rect x="190" y="279" width="379.05" height="15" rx="2" fill="#176b80"/>
    <text x="474.27" y="273" font-size="11">110.91</text>
    <text x="576.05" y="291" font-size="11" font-weight="700">151.62</text>
    <text x="735" y="273" text-anchor="end" font-size="17" font-weight="700" fill="#176b80">1.37×</text>
    <text x="735" y="290" text-anchor="end" font-size="11" fill="#475569">+36.7%</text>
    <line x1="22" y1="303" x2="738" y2="303" stroke="#cbd5e1"/>
    <text x="22" y="324" font-size="14" font-weight="700">Pixel 10 Pro GPU</text><text x="735" y="324" font-size="11" text-anchor="end" fill="#475569">Mean · 4 runs/mode</text>
    <text x="22" y="356" font-size="12">LoRA POC</text>
    <rect x="190" y="336" width="19.25" height="15" rx="2" fill="#8494a8"/>
    <rect x="190" y="354" width="32.00" height="15" rx="2" fill="#176b80"/>
    <text x="216.25" y="348" font-size="11">7.7</text>
    <text x="229.00" y="366" font-size="11" font-weight="700">12.8</text>
    <text x="735" y="348" text-anchor="end" font-size="17" font-weight="700" fill="#176b80">1.66×</text>
    <text x="735" y="365" text-anchor="end" font-size="11" fill="#475569">+66.2%</text>
    <text x="22" y="420" font-size="11" fill="#475569">PC: LiteRT-LM 0.19.2 · Pixel: 0.19.1 · different runtime and sampler; no pooled comparison.</text>
  </g>
</svg>
