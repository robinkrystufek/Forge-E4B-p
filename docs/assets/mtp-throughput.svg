<svg xmlns="http://www.w3.org/2000/svg" width="760" height="437" viewBox="0 0 760 437" role="img" aria-labelledby="title desc">
  <title id="title">MTP decode throughput with observed min–max ranges</title>
  <desc id="desc">Common zero-based linear scale in tokens per second. Error bars show observed minimum and maximum, not confidence intervals. PC CPU Official stock, median, N=3 per mode: MTP off 13.73 (12.88–13.86), on 17.45 (17.16–17.46); PC CPU LoRA POC, median, N=3 per mode: MTP off 14.59 (14.56–14.7), on 18.9 (18.63–18.96); RTX 4090 Official stock, median, N=3 per mode: MTP off 111.45 (108.41–111.58), on 154.48 (100.92–154.91); RTX 4090 LoRA POC, median, N=3 per mode: MTP off 110.91 (107.54–111.53), on 151.62 (110.74–153.91); Pixel 10 Pro GPU LoRA POC, mean, N=4 per mode: MTP off 7.7 (7.5–7.8), on 12.8 (12.7–13).</desc>
  <rect x="0.5" y="0.5" width="759" height="436" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
