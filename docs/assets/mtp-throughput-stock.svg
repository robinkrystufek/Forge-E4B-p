<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Median decode throughput · Stock E4B</title>
  <desc id="desc">Official stock E4B PC baseline: CPU 13.73 to 17.45 tokens per second; RTX 4090 111.45 to 154.48 tokens per second. Common linear scale zero to 160.</desc>
