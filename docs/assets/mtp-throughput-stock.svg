  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#172b3e">
    <text x="24" y="32" font-size="17" font-weight="700">Median decode throughput · Stock E4B</text>
    <text x="24" y="51" font-size="11" fill="#475569">Official stock package · tokens/s · three runs per mode</text>
