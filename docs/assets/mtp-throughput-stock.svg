    <line x1="468" y1="74" x2="468" y2="242" stroke="#d5dee8"/><text x="468" y="259" font-size="11" text-anchor="middle" fill="#475569">120</text>
    <line x1="574" y1="74" x2="574" y2="242" stroke="#d5dee8"/><text x="574" y="259" font-size="11" text-anchor="middle" fill="#475569">160</text>
    <text x="24" y="108" font-size="13" font-weight="650">CPU / XNNPACK</text>
    <rect x="150" y="83" width="36.38" height="20" rx="3" fill="#8494a8"/>
